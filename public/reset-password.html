
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Teara WorkHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f5f0;
      color: #25291f;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px #00000012;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button,
    .link {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #263b25;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #18733b;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main>

    <section id="loading">
      <h1>Verifying reset link</h1>
      <p>Please wait...</p>
    </section>

    <section id="reset" hidden>
      <h1>Set a new password</h1>
      <p id="account"></p>

      <form id="resetForm">

        <label for="password">New password</label>
        <input
          id="password"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
        />

        <label for="confirmPassword">Confirm new password</label>
        <input
          id="confirmPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
        />

        <button id="submitButton" type="submit">
          Update password
        </button>

      </form>
    </section>

    <section id="result" hidden>
      <h1 id="resultTitle"></h1>
      <p id="resultText"></p>

      <a
        class="link"
        href="http://localhost:3000"
      >
        Return to WorkHub
      </a>
    </section>

    <p id="message" role="status"></p>

  </main>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from
      "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";


    // --------------------------------------------------
    // 1. Read Firebase action parameters
    // --------------------------------------------------

    const params = new URLSearchParams(window.location.search);

    const mode = params.get("mode");
    const actionCode = params.get("oobCode");
    const apiKey = params.get("apiKey");


    // --------------------------------------------------
    // 2. Validate reset link
    // --------------------------------------------------

    if (
      mode !== "resetPassword" ||
      !actionCode ||
      !apiKey
    ) {
      document.getElementById("loading").hidden = true;

      document.getElementById("result").hidden = false;

      document.getElementById("resultTitle").textContent =
        "Unable to reset password";

      document.getElementById("resultText").textContent =
        "The reset link is incomplete or invalid.";

      throw new Error("Invalid password-reset action parameters.");
    }


    // --------------------------------------------------
    // 3. Initialize Firebase using the action link API key
    // --------------------------------------------------

    const firebaseConfig = {
      apiKey: apiKey,
      authDomain: "teara-806f0.firebaseapp.com",
      projectId: "teara-806f0",
    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // --------------------------------------------------
    // 4. DOM references
    // --------------------------------------------------

    const loading = document.getElementById("loading");

    const reset = document.getElementById("reset");

    const result = document.getElementById("result");

    const message = document.getElementById("message");

    const form = document.getElementById("resetForm");

    const button = document.getElementById("submitButton");


    // --------------------------------------------------
    // 5. Display errors
    // --------------------------------------------------

    function showError(error) {

      loading.hidden = true;

      reset.hidden = true;

      result.hidden = false;

      document.getElementById("resultTitle").textContent =
        "Unable to reset password";

      document.getElementById("resultText").textContent =
        error;

    }


    // --------------------------------------------------
    // 6. Verify Firebase password-reset code
    // --------------------------------------------------

    async function initializeReset() {

      const email = await verifyPasswordResetCode(
        auth,
        actionCode
      );

      document.getElementById("account").textContent =
        "Resetting password for " + email;

      loading.hidden = true;

      reset.hidden = false;

    }


    // --------------------------------------------------
    // 7. Handle password submission
    // --------------------------------------------------

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.textContent = "";

      message.className = "";

      const password =
        document.getElementById("password").value;

      const confirmation =
        document.getElementById("confirmPassword").value;


      if (password.length < 6) {

        message.textContent =
          "Password must contain at least 6 characters.";

        message.className = "error";

        return;

      }


      if (password !== confirmation) {

        message.textContent =
          "Passwords do not match.";

        message.className = "error";

        return;

      }


      button.disabled = true;

      button.textContent = "Updating...";


      try {

        // Update the Firebase Authentication password.

        await confirmPasswordReset(
          auth,
          actionCode,
          password
        );


        // Display success.

        reset.hidden = true;

        result.hidden = false;

        document.getElementById("resultTitle").textContent =
          "Password updated successfully";

        document.getElementById("resultText").textContent =
          "Your password has been changed. You can now sign in to WorkHub.";


      } catch (error) {

        if (
          error.code === "auth/expired-action-code" ||
          error.code === "auth/invalid-action-code"
        ) {

          message.textContent =
            "This reset link has expired or has already been used. Request a new one.";

        } else if (
          error.code === "auth/weak-password"
        ) {

          message.textContent =
            "Please choose a stronger password.";

        } else {

          message.textContent =
            error.message || "Unable to update password.";

        }

        message.className = "error";

        button.disabled = false;

        button.textContent = "Update password";

      }

    });


    // --------------------------------------------------
    // 8. Start password-reset verification
    // --------------------------------------------------

    initializeReset().catch((error) => {

      let errorMessage;

      if (
        error.code === "auth/expired-action-code" ||
        error.code === "auth/invalid-action-code"
      ) {

        errorMessage =
          "This reset link has expired or has already been used. Generate a new reset link.";

      } else {

        errorMessage =
          error.message || "Please request a new password-reset link.";

      }

      showError(errorMessage);

    });

  </script>

</body>
</html>
